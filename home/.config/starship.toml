"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true


format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_commit\
$cmd_duration\
$line_break\
$character"""

right_format = """
$lua\
$python\
$c\
$rlang\
$java\
"""


[character]
success_symbol = '[➜](bold green) '
error_symbol = '[✗](bold red) '

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

[aws]
symbol = "  "

[battery]
disabled = false

[[battery.display]]
threshold = 100
style = "bold italic bright-green"

[[battery.display]]
threshold = 90
style = "dimmed italic bright-green"

[[battery.display]]
threshold = 75
style = "dimmed italic yellow"

[[battery.display]]
threshold = 50
style = "dimmed italic bright-red"

[[battery.display]]
threshold = 25
style = "dimmed italic red"

[[battery.display]]
threshold = 0
style = "bold italic red"

[buf]
symbol = " "

[c]
symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "

[container]
format = '[$symbol \[$name\]]($style) '

[crystal]
symbol = " "

[dart]
symbol = " "

